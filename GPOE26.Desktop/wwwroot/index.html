<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GPOE26</title>
    <base href="/" />
    <!-- Polices en ligne si disponibles ; sinon les polices du système prennent le relais -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" />
    <!-- KaTeX embarqué : formules affichées même hors connexion -->
    <link rel="stylesheet" href="lib/katex/katex.min.css" />
    <link rel="stylesheet" href="_content/GPOE26.UI/gpoe-app.css" />
    <style>
        html, body { margin: 0; padding: 0; background: #F6F5F1; }
        #blazor-error-ui { display: none; position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 20px; background: #FCE6D4; color: #7A2E00; font-family: system-ui, sans-serif; z-index: 100; }
        #blazor-error-ui .reload { margin-left: 12px; }
        .boot { display: flex; height: 100vh; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: #0E2350; }
    </style>
</head>
<body>
    <div id="app"><div class="boot">Chargement de GPOE26…</div></div>
    <div id="blazor-error-ui">
        Une erreur est survenue.
        <a href="" class="reload">Recharger</a>
    </div>
    <script src="lib/katex/katex.min.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
