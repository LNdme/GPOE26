http_port 0.0.0.0:3128
pinger_enable off

acl CONNECT method CONNECT
acl permitted_methods method GET HEAD CONNECT
acl Safe_ports port 80 443
acl SSL_ports port 443
acl allowed_domains dstdomain .wikipedia.org .openstax.org .khanacademy.org research.google www.researchgate.net www.sciencedirect.com
acl non_public_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4

http_access deny !permitted_methods
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny non_public_dst
http_access allow allowed_domains
http_access deny all

cache deny all
cache_mem 0 MB
access_log none
cache_store_log none
